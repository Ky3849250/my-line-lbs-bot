<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地點地圖預覽</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // 解析網址參數（同時支援一般網址與 LINE LIFF 的 liff.state 格式）
        let urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.has('liff.state')) {
            const liffState = urlParams.get('liff.state');
            // 解碼 liff.state 內包裝的參數
            urlParams = new URLSearchParams(liffState.startsWith('?') ? liffState : '?' + liffState);
        }

        const rawLat = urlParams.get('lat');
        const rawLng = urlParams.get('lng');
        const rawName = urlParams.get('name');

        const destinationLatitude = rawLat ? parseFloat(rawLat) : 25.033968;
        const destinationLongitude = rawLng ? parseFloat(rawLng) : 121.564472;
        const destinationName = rawName ? decodeURIComponent(rawName) : '目標地點';

        const leafletMap = L.map('map').setView([destinationLatitude, destinationLongitude], 17);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(leafletMap);

        L.marker([destinationLatitude, destinationLongitude]).addTo(leafletMap)
            .bindPopup(`<b>${destinationName}</b>`)
            .openPopup();
    </script>
</body>
</html>
