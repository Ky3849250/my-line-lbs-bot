<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地點地圖預覽</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
        .popup-card { padding: 4px; line-height: 1.5; }
        .popup-title { font-size: 15px; font-weight: bold; color: #1DB446; margin-bottom: 4px; }
        .popup-tag { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 2px 6px; border-radius: 4px; font-size: 12px; margin-top: 4px; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        let urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.has('liff.state')) {
            const liffState = urlParams.get('liff.state');
            urlParams = new URLSearchParams(liffState.startsWith('?') ? liffState : '?' + liffState);
        }

        const destinationLatitude = parseFloat(urlParams.get('lat')) || 25.033968;
        const destinationLongitude = parseFloat(urlParams.get('lng')) || 121.564472;
        const destinationName = decodeURIComponent(urlParams.get('name') || '目標地點');

        const leafletMap = L.map('map').setView([destinationLatitude, destinationLongitude], 17);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(leafletMap);

        // 建立豐富的資訊彈窗
        const popupContent = `
            <div class="popup-card">
                <div class="popup-title">${destinationName}</div>
                <div>📍 經緯度：${destinationLatitude.toFixed(4)}, ${destinationLongitude.toFixed(4)}</div>
                <div class="popup-tag">導航準備就緒</div>
            </div>
        `;

        L.marker([destinationLatitude, destinationLongitude]).addTo(leafletMap)
            .bindPopup(popupContent)
            .openPopup();
    </script>
</body>
</html>
