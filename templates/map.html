<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地點地圖預覽</title>
    <!-- 引入免費開源地圖 Leaflet.js CSS 與 JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // 解析 URL 傳入的經緯度與名稱參數 (?lat=...&lng=...&name=...)
        const urlParameters = new URLSearchParams(window.location.search);
        const destinationLatitude = parseFloat(urlParameters.get('lat')) || 25.033968;
        const destinationLongitude = parseFloat(urlParameters.get('lng')) || 121.564472;
        const destinationName = urlParameters.get('name') || '目標地點';

        // 初始化地圖，設定中心點與縮放層級
        const leafletMap = L.map('map').setView([destinationLatitude, destinationLongitude], 16);

        // 載入 OpenStreetMap 圖資
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(leafletMap);

        // 建立地標大頭針並彈出標籤
        L.marker([destinationLatitude, destinationLongitude]).addTo(leafletMap)
            .bindPopup(`<b>${destinationName}</b>`)
            .openPopup();
    </script>
</body>
</html>
